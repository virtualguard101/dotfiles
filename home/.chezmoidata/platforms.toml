# Each managed target (a path relative to ~; directory entries cover everything below) deploys
# only on its own platform. .chezmoiignore derives its rules from this file, so `chezmoi add` /
# `re-add` on one platform never reads or overwrites the other platform's source files.
#
# - `dotfiles backup` registers new targets under the current platform automatically
# - `dotfiles check` requires every managed target to be listed exactly once
# - targets deployed on both platforms (identical, or told apart by templates) go in shared
[platforms]
shared = [
  ".gitconfig",
]
linux = [
  ".agents/ccs_config.sql",
  ".aria2/aria2.conf",
  ".bash_profile",
  ".bashrc",
  ".config/Code",
  ".config/Cursor",
  ".config/autostart/CC Switch.desktop",
  ".config/autostart/Clash Verge.desktop",
  ".config/autostart/vboxclient.desktop",
  ".config/bottom/bottom.toml",
  ".config/dolphinrc",
  ".config/environment.d",
  ".config/fcitx5",
  ".config/fontconfig",
  ".config/gh/config.yml",
  ".config/gh/hosts.yml",
  ".config/ghostty/config",
  ".config/htop/htoprc",
  ".config/kdeglobals",
  ".config/kglobalshortcutsrc",
  ".config/konsolerc",
  ".config/kwinrc",
  ".config/kxkbrc",
  ".config/mimeapps.list",
  ".config/nvim",
  ".config/systemd/user/kwallet_auto_unlock.service",
  ".config/systemd/user/taskdog-server.service",
  ".config/systemd/user/zeroclaw.service",
  ".config/user-dirs.dirs",
  ".config/zellij",
  ".local/share/fcitx5/rime/default.custom.yaml",
  ".local/share/konsole/Sweet-Ambar-Blue.colorscheme",
  ".local/share/konsole/Sweet-Mars.colorscheme",
  ".local/share/konsole/Sweet.colorscheme",
  ".local/share/konsole/配置方案 1.profile",
  ".npmrc",
  ".p10k.zsh",
  ".profile",
  ".pypirc",
  ".ssh/config",
  ".tmux.conf",
  ".tool-versions",
  ".vimrc",
  ".zimrc",
  ".zshenv",
  ".zshrc",
  "tmux",
]
windows = [
  ".claude/settings.json",
  ".config/scoop",
  ".docker/config.json",
  ".wakatime.cfg",
  "AppData",
  "Documents/PowerToys",
]
