[project]
name = "dotfiles"
version = "0.3.0"
description = "Cross-platform dotfiles maintenance on chezmoi: environment checks, post-reinstall recovery, backup and cache cleanup"
readme = "README.md"
authors = [
    { name = "vgca101", email = "virtualguard101@gmail.com" }
]
requires-python = ">=3.12"
# Runtime needs only the standard library: on a new machine uv just downloads the Python interpreter, no PyPI access
dependencies = []

[project.scripts]
dotfiles = "dotfiles.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
