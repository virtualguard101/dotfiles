# gitleaks config: extend the built-in rules with the rules and exemptions this repo needs.
# The gitleaks hook in pre-commit reads this file from the repo root automatically.
title = "dotfiles"

[extend]
useDefault = true

# WakaTime API key (not covered by the built-in rules)
[[rules]]
id = "wakatime-api-key"
description = "WakaTime API key"
regex = '''waka_[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
keywords = ["waka_"]

# age ciphertext is random base64 and is not scanned; guard validates separately that these
# files really are ciphertext, so renaming plaintext to .age does not bypass the check.
[[allowlists]]
description = "age ciphertext"
paths = ['''(^|/)encrypted_[^/]*\.age$''']
