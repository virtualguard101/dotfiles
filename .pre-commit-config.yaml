# Commit/push checks. Windows and Linux share this file; run once per machine:
#   pre-commit install        (installs both pre-commit and pre-push per default_install_hook_types)
# See the "Commit checks (pre-commit)" section of docs/reference.md.
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # cross-platform hygiene checks: inspect only, never rewrite dotfiles content
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-illegal-windows-names
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml

  # general secret scan (--redact: values never appear in the output). pre-commit downloads
  # Go and builds gitleaks automatically
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # repo-specific rules: age ciphertext validation, must-encrypt targets, secret patterns
  - repo: local
    hooks:
      - id: prune-precommit-stash
        name: prune pre-commit stash patches
        entry: python src/dotfiles/utils/common/guard prune-stash
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: dotfiles-guard
        name: dotfiles guard (staged)
        entry: python src/dotfiles/utils/common/guard staged
        language: python
        verbose: true
        stages: [pre-commit]
      - id: dotfiles-guard-push
        name: dotfiles guard (every pushed commit)
        entry: python src/dotfiles/utils/common/guard push
        language: python
        pass_filenames: false
        always_run: true
        stages: [pre-push]
